name: Package embedded compiler

on:
  workflow_dispatch:
    inputs:
      onda_run_id:
        description: Onda SDK build run ID; leave both Onda inputs empty to use the pinned release
        type: string
        default: ''
      onda_source_ref:
        description: Exact full Onda source commit of that SDK run
        type: string
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: Extension source commit
        required: true
        type: string
      onda_source_ref:
        description: Exact full Onda source commit of the SDK run
        type: string
        default: ''
      onda_run_id:
        description: Onda SDK build run ID; empty uses the pinned release
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  gpu-ui:
    runs-on: ubuntu-24.04
    outputs:
      onda-version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - name: Validate Onda SDK inputs
        env:
          ONDA_SOURCE_REF: ${{ inputs.onda_source_ref }}
          ONDA_RUN_ID: ${{ inputs.onda_run_id }}
        run: |
          if [[ -n "$ONDA_RUN_ID" || -n "$ONDA_SOURCE_REF" ]]; then
            if [[ ! "$ONDA_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$ONDA_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'An unpublished SDK requires both a build run ID and its full Onda source commit' >&2
              exit 1
            fi
          fi
      - uses: actions/checkout@v5
        with:
          repository: onda-lang/onda-vscode
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read pinned Onda version
        id: version
        run: |
          echo "version=$(node ./scripts/onda-version.mjs)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node ./scripts/compiler-bundle.mjs)" >> "$GITHUB_OUTPUT"
      - name: Check out matching Onda UI source
        uses: actions/checkout@v5
        with:
          repository: onda-lang/onda
          ref: ${{ inputs.onda_source_ref || format('refs/tags/{0}', steps.version.outputs.version) }}
          path: .onda-source
      - name: Verify Onda UI source
        env:
          ONDA_VERSION: ${{ steps.version.outputs.version }}
          ONDA_SOURCE_REF: ${{ inputs.onda_source_ref }}
        run: |
          expected="${ONDA_SOURCE_REF:-refs/tags/$ONDA_VERSION}"
          test "$(git -C .onda-source rev-parse HEAD)" = \
            "$(git -C .onda-source rev-parse "$expected^{commit}")"
          if [[ ! -f .onda-source/scripts/build-gpu-ui.mjs ]]; then
            echo "Onda $ONDA_VERSION has no GPU UI build. Update onda-version to the GPU release." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build shared GPU UI
        working-directory: .onda-source
        run: |
          npm ci
          cargo install wasm-pack --version 0.15.0 --locked
          npm run build:gpu-ui
      - name: Stage matching GPU UI
        run: node ./scripts/stage-gpu-ui.mjs .onda-source/ui/gpu
      - run: npm test
      - uses: actions/upload-artifact@v6
        with:
          name: onda-gpu-ui-${{ steps.version.outputs.version }}
          path: ui/gpu/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: gpu-ui
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      ONDA_VERSION: ${{ needs.gpu-ui.outputs.onda-version }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gpu-ui.outputs.matrix) }}
    steps:
      - name: Prepare Debian 12 compiler environment
        if: runner.os == 'Linux'
        run: |
          source /etc/os-release
          test "$ID:$VERSION_ID" = debian:12
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.36'
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils libasound2 libpipewire-0.3-0
      - uses: actions/checkout@v5
        with:
          repository: onda-lang/onda-vscode
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download matching shared GPU UI
        uses: actions/download-artifact@v7
        with:
          name: onda-gpu-ui-${{ env.ONDA_VERSION }}
          path: ui/gpu
      - name: Download unpublished Onda compiler
        if: inputs.onda_source_ref != ''
        uses: actions/download-artifact@v7
        with:
          name: onda-${{ matrix.release }}
          path: ${{ runner.temp }}/onda-sdk
          repository: onda-lang/onda
          run-id: ${{ inputs.onda_run_id }}
          github-token: ${{ github.token }}
      - name: Select and verify Onda compiler archive
        id: compiler
        shell: bash
        env:
          ONDA_SOURCE_REF: ${{ inputs.onda_source_ref }}
          RELEASE_TARGET: ${{ matrix.release }}
          ARCHIVE_EXTENSION: ${{ matrix.extension }}
        run: |
          version="$(node ./scripts/onda-version.mjs)"
          name="onda-$version-$RELEASE_TARGET"
          if [[ -n "$ONDA_SOURCE_REF" ]]; then
            test "$(cat "$RUNNER_TEMP/onda-sdk/onda-source.txt")" = "$ONDA_SOURCE_REF"
            archive="$RUNNER_TEMP/onda-sdk/$name.$ARCHIVE_EXTENSION"
            checksums="$RUNNER_TEMP/onda-sdk/SHA256SUMS.txt"
          else
            archive="$RUNNER_TEMP/$name.$ARCHIVE_EXTENSION"
            checksums="$RUNNER_TEMP/SHA256SUMS.txt"
            curl --fail --location --retry 3 \
              "https://github.com/onda-lang/onda/releases/download/$version/$name.$ARCHIVE_EXTENSION" \
              --output "$archive"
            curl --fail --location --retry 3 \
              "https://github.com/onda-lang/onda/releases/download/$version/SHA256SUMS.txt" \
              --output "$checksums"
          fi
          node ./scripts/verify-onda-archive.mjs "$archive" "$checksums"
          if [[ "$ARCHIVE_EXTENSION" == "zip" ]]; then
            unzip -q "$archive" -d "$RUNNER_TEMP"
          else
            tar -xf "$archive" -C "$RUNNER_TEMP"
          fi
          echo "directory=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
      - name: Package platform extension
        env:
          COMPILER_DIRECTORY: ${{ steps.compiler.outputs.directory }}
          VSIX_TARGET: ${{ matrix.target }}
        run: npm run package:embedded -- "$COMPILER_DIRECTORY" "$VSIX_TARGET"
      - name: Test the packaged compiler without Onda on PATH
        env:
          VSIX_TARGET: ${{ matrix.target }}
        run: |
          unpacked="$RUNNER_TEMP/onda-packaged"
          unzip -q "onda-embedded-$VSIX_TARGET.vsix" -d "$unpacked"
          npm run test:compiler -- "$unpacked/extension"
      - uses: actions/upload-artifact@v6
        with:
          name: onda-embedded-${{ matrix.target }}
          path: onda-embedded-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 14
